<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Detection System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f1a; --container: #1a1a2e; --text: #e0e0ff;
            --subtext: #9090bb; --primary: #7b8cde; --success: #06d6a0;
            --danger: #ef233c; --border: #2a2a4a; --input-bg: #12122a;
            --history-bg: #12122a;
        }
        [data-theme="light"] {
            --bg: #f0f2f5; --container: #ffffff; --text: #1a1a2e;
            --subtext: #555577; --primary: #4361ee; --border: #e0e0f0;
            --input-bg: #f5f7fa; --history-bg: #f0f2ff;
        }
        [data-theme="pride"] {
            --bg: #0f0f1a; --container: #1a1a2e; --text: #ffffff;
            --subtext: #cccccc; --border: transparent;
            --input-bg: #12122a; --history-bg: #12122a;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
        body {
            background:var(--bg); color:var(--text);
            min-height:100vh; display:flex; flex-direction:column;
            transition:background 0.3s, color 0.3s;
        }
        .theme-bar {
            position:fixed; top:14px; right:20px; z-index:1000;
            display:flex; gap:2px; background:var(--container);
            padding:5px 8px; border-radius:30px;
            box-shadow:0 4px 20px rgba(0,0,0,0.3); border:1px solid var(--border);
        }
        .theme-btn {
            background:none; border:none; cursor:pointer;
            font-size:1rem; padding:3px 5px; border-radius:20px;
            transition:background 0.2s, transform 0.2s;
        }
        .theme-btn:hover { background:var(--input-bg); transform:scale(1.15); }
        .app {
            flex:1; display:flex; align-items:center;
            justify-content:center; padding:1rem; padding-top:4rem;
        }
        .panels {
            display:flex; gap:1rem; width:85%; max-width:1200px;
            height:85vh; transition:all 0.4s cubic-bezier(0.4,0,0.2,1);
        }
        .panel {
            background:var(--container); border-radius:20px; padding:1.8rem;
            border:1px solid var(--border); box-shadow:0 8px 32px rgba(0,0,0,0.15);
            overflow-y:auto; overflow-x:hidden;
            transition:flex 0.4s cubic-bezier(0.4,0,0.2,1);
            display:flex; flex-direction:column;
        }
        .panel.hidden { display:none !important; }
        .panel::-webkit-scrollbar { width:4px; }
        .panel::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
        [data-theme="pride"] .panel {
            border:2px solid transparent;
            background:linear-gradient(#1a1a2e,#1a1a2e) padding-box,
                        linear-gradient(135deg,#ff0000,#ff7700,#ffff00,#00cc00,#0000ff,#8b00ff) border-box;
        }
        [data-theme="pride"] .panel-title {
            background:linear-gradient(135deg,#ff0000,#ff7700,#ffff00,#00cc00,#0000ff,#8b00ff);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        }
        .panel-title { font-size:1.3rem; font-weight:700; color:var(--text); margin-bottom:0.3rem; }
        .panel-sub { font-size:0.85rem; color:var(--subtext); margin-bottom:1rem; }
        .divider { height:1px; background:var(--border); margin:0.8rem 0; }
        .input-group { margin-bottom:0.9rem; }
        .input-label { display:block; font-size:0.88rem; font-weight:600; color:var(--text); margin-bottom:0.4rem; }
        .input-field {
            width:100%; padding:0.75rem 1rem;
            background:var(--input-bg); border:1px solid var(--border);
            border-radius:10px; color:var(--text); font-size:0.95rem;
            outline:none; transition:border 0.2s, box-shadow 0.2s;
        }
        .input-field:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(123,140,222,0.15); }
        select.input-field { cursor:pointer; }
        .limit-bar-wrap { margin-top:6px; }
        .limit-bar-label { font-size:0.75rem; color:var(--subtext); margin-bottom:3px; display:flex; justify-content:space-between; }
        .limit-bar { height:5px; background:var(--border); border-radius:10px; overflow:hidden; }
        .limit-bar-fill { height:100%; border-radius:10px; transition:width 0.4s, background 0.3s; }
        .check-btn {
            width:100%; padding:0.85rem; background:var(--primary); color:white;
            border:none; border-radius:12px; font-size:0.95rem; font-weight:600;
            cursor:pointer; margin-top:auto; transition:all 0.2s;
        }
        .check-btn:hover { transform:translateY(-2px); box-shadow:0 4px 20px rgba(123,140,222,0.4); }
        .check-btn:disabled { opacity:0.7; cursor:not-allowed; transform:none; }
        .result-placeholder {
            flex:1; display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            color:var(--subtext); text-align:center; gap:0.8rem;
        }
        .placeholder-icon { font-size:2.5rem; opacity:0.2; }
        .result-box {
            flex:1; border-radius:16px; padding:1.5rem; text-align:center;
            display:flex; flex-direction:column; justify-content:center; align-items:center;
        }
        .result-box.fraud {
            background:linear-gradient(135deg,rgba(239,35,60,0.12),rgba(239,35,60,0.04));
            border:2px solid var(--danger);
            animation:shake 0.5s ease-in-out, flashRed 1s ease-in-out 3;
        }
        .result-box.normal {
            background:linear-gradient(135deg,rgba(6,214,160,0.12),rgba(6,214,160,0.04));
            border:2px solid var(--success); animation:fadeInUp 0.6s ease-out;
        }
        .result-emoji { font-size:2.8rem; margin-bottom:0.5rem; }
        .result-title { font-size:1.5rem; font-weight:700; margin-bottom:0.3rem; }
        .result-sub { color:var(--subtext); font-size:0.88rem; margin-bottom:0.8rem; }
        .risk-score { font-size:2.2rem; font-weight:700; margin-bottom:1rem; }
        .result-meta { display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap; margin-bottom:0.8rem; }
        .meta-chip {
            background:var(--input-bg); padding:0.3rem 0.7rem;
            border-radius:20px; font-size:0.78rem;
            color:var(--subtext); border:1px solid var(--border);
        }
        .hint-text { font-size:0.76rem; color:var(--subtext); opacity:0.6; margin-top:0.5rem; }
        .history-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem; }
        .clear-btn {
            background:none; border:1px solid var(--border); color:var(--subtext);
            padding:3px 8px; border-radius:8px; cursor:pointer; font-size:0.78rem; transition:all 0.2s;
        }
        .clear-btn:hover { background:var(--danger); color:white; border-color:var(--danger); }
        .history-list { display:flex; flex-direction:column; gap:0.5rem; }
        .history-item {
            background:var(--history-bg); border-radius:12px;
            padding:0.7rem 0.9rem; border-left:4px solid;
            cursor:pointer; transition:transform 0.2s; animation:slideIn 0.3s ease-out;
        }
        .history-item:hover { transform:translateX(4px); }
        .history-item-top { display:flex; justify-content:space-between; align-items:center; }
        .history-amount { font-weight:600; font-size:0.88rem; color:var(--text); }
        .history-meta-text { font-size:0.75rem; color:var(--subtext); margin-top:3px; }
        .badge { display:inline-block; padding:2px 9px; border-radius:20px; font-size:0.72rem; font-weight:700; color:white; }
        .badge-fraud { background:var(--danger); }
        .badge-normal { background:var(--success); }
        .reasons-expand { margin-top:0.6rem; }
        .reasons-title { font-size:0.78rem; font-weight:700; margin-bottom:0.4rem; }
        .reason-item {
            display:flex; align-items:flex-start; gap:0.5rem;
            padding:0.35rem 0.6rem; border-radius:8px;
            margin-bottom:0.3rem; font-size:0.78rem; color:var(--text);
        }
        .reason-item.fraud-r { background:rgba(239,35,60,0.08); }
        .reason-item.safe-r  { background:rgba(6,214,160,0.08); }
        .reason-icon { font-size:0.85rem; flex-shrink:0; }
        .click-hint { font-size:0.75rem; color:var(--subtext); text-align:center; margin-top:auto; padding-top:0.8rem; opacity:0.6; }
        .spinner {
            display:inline-block; width:16px; height:16px;
            border:2px solid rgba(255,255,255,0.3); border-top-color:white;
            border-radius:50%; animation:spin 0.7s linear infinite;
            vertical-align:middle; margin-right:6px;
        }
        @keyframes shake {
            0%,100% { transform:translateX(0); }
            20% { transform:translateX(-8px); }
            40% { transform:translateX(8px); }
            60% { transform:translateX(-8px); }
            80% { transform:translateX(8px); }
        }
        @keyframes flashRed {
            0%,100% { box-shadow:0 0 0 var(--danger); }
            50% { box-shadow:0 0 30px var(--danger); }
        }
        @keyframes fadeInUp {
            from { opacity:0; transform:translateY(20px); }
            to   { opacity:1; transform:translateY(0); }
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        @keyframes slideIn {
            from { opacity:0; transform:translateX(10px); }
            to   { opacity:1; transform:translateX(0); }
        }
        @media (max-width:768px) {
            body { overflow:auto; }
            .theme-bar { top:8px; right:10px; }
            .app { align-items:flex-start; padding:0.5rem; padding-top:3.5rem; }
            .panels { flex-direction:column !important; width:100% !important; max-width:100% !important; height:auto !important; }
            .panel { flex:none !important; width:100% !important; min-height:250px; }
            .click-hint { display:none !important; }
        }
    </style>
</head>
<body data-theme="dark">

<div class="theme-bar">
    <button class="theme-btn" onclick="setTheme('light')" title="Light">☀️</button>
    <button class="theme-btn" onclick="setTheme('dark')"  title="Dark">🌙</button>
    <button class="theme-btn" onclick="setTheme('pride')" title="Pride">🏳️‍🌈</button>
</div>

<div class="app">
    <div class="panels" id="panels">

        <!-- FORM PANEL -->
        <div class="panel" id="panel-form">
            <div class="panel-title">🔍 Fraud Detector</div>
            <div class="panel-sub">Enter transaction details below</div>
            <div class="divider"></div>

            <div class="input-group">
                <label class="input-label">🏦 Account Type</label>
                <select class="input-field" id="account-type" onchange="updateAccountInfo()">
                    <option value="student">🎓 Student Account</option>
                    <option value="savings" selected>👤 Savings Account</option>
                    <option value="current">💳 Current Account</option>
                    <option value="business">🏢 Business Account</option>
                    <option value="premium">💎 Premium Account</option>
                </select>
                <div class="limit-bar-wrap">
                    <div class="limit-bar-label">
                        <span id="limit-label">Daily limit usage</span>
                        <span id="limit-percent">0%</span>
                    </div>
                    <div class="limit-bar">
                        <div class="limit-bar-fill" id="limit-fill" style="width:0%;background:#06d6a0;"></div>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">🌍 Currency</label>
                <select class="input-field" id="currency" onchange="updateCurrencyLabel()">
                    <option value="USD">🇺🇸 USD — US Dollar</option>
                    <option value="EUR">🇪🇺 EUR — Euro</option>
                    <option value="GBP">🇬🇧 GBP — British Pound</option>
                    <option value="JPY">🇯🇵 JPY — Japanese Yen</option>
                    <option value="CNY">🇨🇳 CNY — Chinese Yuan</option>
                    <option value="INR" selected>🇮🇳 INR — Indian Rupee</option>
                    <option value="CAD">🇨🇦 CAD — Canadian Dollar</option>
                    <option value="AUD">🇦🇺 AUD — Australian Dollar</option>
                    <option value="CHF">🇨🇭 CHF — Swiss Franc</option>
                    <option value="SGD">🇸🇬 SGD — Singapore Dollar</option>
                    <option value="PHP">🇵🇭 PHP — Philippine Peso</option>
                </select>
            </div>

            <div class="input-group">
                <label class="input-label" id="amount-label">💰 Amount (₹)</label>
                <input type="number" class="input-field" id="amount"
                    min="0" step="10" placeholder="e.g. 500"
                    oninput="updateLimitBar()"
                    onkeydown="if(event.key==='Enter') checkTransaction()">
            </div>

            <div class="input-group">
                <label class="input-label">⏰ Transaction Time</label>
                <select class="input-field" id="time-hour">
                    <option value="0">🌙 12:00 AM (Midnight)</option>
                    <option value="1">🌙 1:00 AM</option>
                    <option value="2">🌙 2:00 AM</option>
                    <option value="3">🌙 3:00 AM</option>
                    <option value="4">🌙 4:00 AM</option>
                    <option value="5">🌅 5:00 AM</option>
                    <option value="6">🌅 6:00 AM</option>
                    <option value="7">☀️ 7:00 AM</option>
                    <option value="8">☀️ 8:00 AM</option>
                    <option value="9">☀️ 9:00 AM</option>
                    <option value="10">☀️ 10:00 AM</option>
                    <option value="11">☀️ 11:00 AM</option>
                    <option value="12">☀️ 12:00 PM (Noon)</option>
                    <option value="13">☀️ 1:00 PM</option>
                    <option value="14" selected>☀️ 2:00 PM</option>
                    <option value="15">☀️ 3:00 PM</option>
                    <option value="16">☀️ 4:00 PM</option>
                    <option value="17">🌆 5:00 PM</option>
                    <option value="18">🌆 6:00 PM</option>
                    <option value="19">🌆 7:00 PM</option>
                    <option value="20">🌃 8:00 PM</option>
                    <option value="21">🌃 9:00 PM</option>
                    <option value="22">🌙 10:00 PM</option>
                    <option value="23">🌙 11:00 PM</option>
                </select>
                <small style="color:var(--subtext);font-size:0.75rem;margin-top:4px;display:block;">
                    💡 Late night (12AM–6AM) transactions are more suspicious
                </small>
            </div>

            <button class="check-btn" id="check-btn" onclick="checkTransaction()">
                🔍 Check Transaction
            </button>
        </div>

        <!-- RESULT PANEL -->
        <div class="panel hidden" id="panel-result">
            <div class="result-placeholder" id="result-placeholder">
                <div class="placeholder-icon">🔍</div>
                <p>Results appear here</p>
            </div>
            <div id="result-content" style="display:none; flex-direction:column; flex:1;"></div>
            <div class="click-hint" id="result-hint" style="display:none">Click to expand</div>
        </div>

        <!-- HISTORY PANEL -->
        <div class="panel hidden" id="panel-history">
            <div class="history-header">
                <div class="panel-title" style="font-size:1.05rem;">📜 History</div>
                <button class="clear-btn" id="clear-btn">🗑️ Clear</button>
            </div>
            <div class="divider" style="margin-top:0;"></div>
            <div class="history-list" id="history-list"></div>
            <div class="click-hint">👆 Click any item for details</div>
        </div>

    </div>
</div>

<script>
    let txHistory = [];
    let activePanel = 'form';

    const accountTypes = {
        student:  { label:'🎓 Student',  suspiciousAbove:5000,    dailyLimit:10000,    color:'#7b8cde' },
        savings:  { label:'👤 Savings',  suspiciousAbove:50000,   dailyLimit:100000,   color:'#06d6a0' },
        current:  { label:'💳 Current',  suspiciousAbove:200000,  dailyLimit:500000,   color:'#f4a261' },
        business: { label:'🏢 Business', suspiciousAbove:1000000, dailyLimit:5000000,  color:'#4cc9f0' },
        premium:  { label:'💎 Premium',  suspiciousAbove:5000000, dailyLimit:10000000, color:'#c77dff' }
    };

    const currencies = {
        USD:{ symbol:'$',    rate:83    },
        EUR:{ symbol:'€',    rate:90    },
        GBP:{ symbol:'£',    rate:105   },
        JPY:{ symbol:'¥',    rate:0.55  },
        CNY:{ symbol:'¥',    rate:11.5  },
        INR:{ symbol:'₹',    rate:1     },
        CAD:{ symbol:'CA$',  rate:61    },
        AUD:{ symbol:'A$',   rate:54    },
        CHF:{ symbol:'CHF',  rate:93    },
        SGD:{ symbol:'S$',   rate:62    },
        PHP:{ symbol:'₱',    rate:1.47  }
    };

    function getAccount()  { return accountTypes[document.getElementById('account-type').value]; }
    function getCurrency() { return currencies[document.getElementById('currency').value]; }

    function getTimeStr() {
        const h = parseInt(document.getElementById('time-hour').value);
        if (h === 0)  return '12:00 AM';
        if (h < 12)   return h + ':00 AM';
        if (h === 12) return '12:00 PM';
        return (h - 12) + ':00 PM';
    }

    function updateCurrencyLabel() {
        const c = getCurrency();
        document.getElementById('amount-label').textContent = `💰 Amount (${c.symbol})`;
        updateLimitBar();
    }

    function updateAccountInfo() { updateLimitBar(); }

    function updateLimitBar() {
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const c      = getCurrency();
        const acc    = getAccount();
        const inr    = amount * c.rate;
        const pct    = Math.min((inr / acc.dailyLimit) * 100, 100);
        const limitInCurrency = (acc.dailyLimit / c.rate).toFixed(0);

        document.getElementById('limit-fill').style.width      = pct + '%';
        document.getElementById('limit-fill').style.background = pct > 90 ? '#ef233c' : pct > 60 ? '#f4a261' : '#06d6a0';
        document.getElementById('limit-percent').textContent   = pct.toFixed(1) + '%';
        document.getElementById('limit-label').textContent     = `${acc.label} daily limit (${c.symbol}${parseInt(limitInCurrency).toLocaleString()})`;
    }

    function setTheme(t) {
        document.body.setAttribute('data-theme', t);
        localStorage.setItem('fds-theme', t);
    }
    setTheme(localStorage.getItem('fds-theme') || 'dark');

    function getFraudReasons(amount, timeStr, risk, c, acc) {
        const inr = amount * c.rate;
        const h   = parseInt(document.getElementById('time-hour').value);
        const reasons = [];
        if (inr > acc.suspiciousAbove) {
            reasons.push({ icon:'🚨', text:`${c.symbol}${amount.toFixed(0)} exceeds suspicious threshold for ${acc.label} (max safe: ${c.symbol}${(acc.suspiciousAbove/c.rate).toFixed(0)})` });
        }
        if (inr > acc.dailyLimit * 0.8) {
            reasons.push({ icon:'💸', text:`Uses over 80% of your ${acc.label} daily limit` });
        }
        if (h >= 0 && h < 6) {
            reasons.push({ icon:'🌙', text:`Transaction at ${timeStr} — suspicious late night activity` });
        }
        if (h >= 22 || h < 4) {
            reasons.push({ icon:'🕐', text:'Most frauds occur between 10PM and 4AM' });
        }
        if (risk > 50) {
            reasons.push({ icon:'🤖', text:'AI model detected anomalous pattern in transaction data' });
        }
        if (reasons.length === 0) {
            reasons.push({ icon:'🔍', text:'Transaction pattern does not match normal behavior' });
            reasons.push({ icon:'📊', text:'Multiple subtle risk factors detected by ML model' });
        }
        return reasons;
    }

    function getSafeReasons(amount, timeStr, risk, c, acc) {
        const inr = amount * c.rate;
        const h   = parseInt(document.getElementById('time-hour').value);
        const reasons = [];
        if (inr <= acc.suspiciousAbove) {
            reasons.push({ icon:'✅', text:`Amount ${c.symbol}${amount.toFixed(0)} is within safe range for ${acc.label}` });
        }
        if (h >= 8 && h <= 20) {
            reasons.push({ icon:'🌤️', text:`Transaction at ${timeStr} — normal business hours` });
        }
        if (risk < 20) {
            reasons.push({ icon:'🛡️', text:'Very low risk score — matches normal behavior' });
        }
        reasons.push({ icon:'📊', text:`Consistent with typical ${acc.label} spending patterns` });
        return reasons;
    }

    function setLayout() {
        const f = document.getElementById('panel-form');
        const r = document.getElementById('panel-result');
        const h = document.getElementById('panel-history');
        const hasHistory = txHistory.length > 0;
        const hasResult  = document.getElementById('result-content').style.display === 'flex';

        r.classList.toggle('hidden', !hasResult);
        h.classList.toggle('hidden', !hasHistory);

        if (window.innerWidth <= 768) return;

        const panels = document.getElementById('panels');
        if (!hasResult) {
            f.style.flex = '1'; panels.style.maxWidth = '500px';
        } else {
            panels.style.maxWidth = '1200px';
            if (!hasHistory) {
                f.style.flex='5'; r.style.flex='5';
            } else {
                if (activePanel==='form')    { f.style.flex='4'; r.style.flex='4'; h.style.flex='2'; }
                if (activePanel==='result')  { f.style.flex='2'; r.style.flex='6'; h.style.flex='2'; }
                if (activePanel==='history') { f.style.flex='2'; r.style.flex='2'; h.style.flex='6'; }
            }
        }
        document.getElementById('result-hint').style.display =
            (activePanel !== 'result' && hasHistory) ? 'block' : 'none';
    }

    document.getElementById('panel-result').addEventListener('click', () => {
        if (activePanel!=='result') { activePanel='result'; setLayout(); }
    });
    document.getElementById('panel-history').addEventListener('click', () => {
        if (activePanel!=='history') { activePanel='history'; setLayout(); }
    });
    document.getElementById('panel-form').addEventListener('click', () => {
        if (activePanel!=='form') { activePanel='form'; setLayout(); }
    });

    async function checkTransaction() {
        const amount    = parseFloat(document.getElementById('amount').value) || 0;
        const currency  = getCurrency();
        const acc       = getAccount();
        const timeStr   = getTimeStr();
        const h         = parseInt(document.getElementById('time-hour').value);
        const amountINR = amount * currency.rate;
        const timeVal   = h * 3600;
        const btn = document.getElementById('check-btn');

        if (amount <= 0) { document.getElementById('amount').focus(); return; }

        btn.innerHTML = '<span class="spinner"></span> Analyzing...';
        btn.disabled = true;

        try {
            const res = await fetch('/predict', {
                method:'POST',
                headers:{ 'Content-Type':'application/json' },
                body: JSON.stringify({ amount: amountINR, time: timeVal })
            });
            const data = await res.json();

            if (amountINR > acc.suspiciousAbove && !data.is_fraud) {
                data.is_fraud = true;
                data.result   = 'Fraud';
                data.risk     = Math.max(data.risk, 75);
            }

            txHistory.unshift({
                amount, timeStr, currency, acc,
                risk: data.risk, result: data.result,
                is_fraud: data.is_fraud,
                ts: new Date().toLocaleTimeString()
            });

            renderResult(data, amount, timeStr, currency, acc);
            renderHistory();
            activePanel = 'result';
            setLayout();
        } catch(e) {
            console.error(e);
            alert('Something went wrong. Please try again!');
        }

        btn.innerHTML = '🔍 Check Transaction';
        btn.disabled = false;
    }

    function renderResult(data, amount, timeStr, currency, acc) {
        document.getElementById('result-placeholder').style.display = 'none';
        const content = document.getElementById('result-content');
        content.style.display = 'flex';
        content.style.flexDirection = 'column';
        content.style.flex = '1';

        const isFraud = data.is_fraud;

        content.innerHTML = `
            <div class="result-box ${isFraud ? 'fraud' : 'normal'}">
                <div class="result-emoji">${isFraud ? '🚨' : '✅'}</div>
                <div class="result-title" style="color:var(${isFraud ? '--danger' : '--success'})">
                    ${isFraud ? 'FRAUD DETECTED!' : 'NORMAL TRANSACTION'}
                </div>
                <div class="result-sub">
                    ${isFraud ? 'This transaction looks suspicious!' : 'This transaction looks safe!'}
                </div>
                <div class="risk-score" style="color:var(${isFraud ? '--danger' : '--success'})">
                    ${data.risk.toFixed(1)}% Risk
                </div>
                <div class="result-meta">
                    <div class="meta-chip">💰 ${currency.symbol}${amount.toFixed(2)}</div>
                    <div class="meta-chip">⏰ ${timeStr}</div>
                    <div class="meta-chip">${acc.label}</div>
                    <div class="meta-chip">🎯 ${data.result}</div>
                </div>
                <div class="hint-text">👉 Click history item to see why</div>
            </div>`;
    }

    function renderHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = '';

        txHistory.forEach((h, index) => {
            const color = h.is_fraud ? 'var(--danger)' : 'var(--success)';
            const badge = h.is_fraud ? 'badge-fraud' : 'badge-normal';
            const reasons = h.is_fraud
                ? getFraudReasons(h.amount, h.timeStr, h.risk, h.currency, h.acc)
                : getSafeReasons(h.amount, h.timeStr, h.risk, h.currency, h.acc);

            const reasonsHTML = reasons.map(r => `
                <div class="reason-item ${h.is_fraud ? 'fraud-r' : 'safe-r'}">
                    <span class="reason-icon">${r.icon}</span>
                    <span>${r.text}</span>
                </div>`).join('');

            const el = document.createElement('div');
            el.className = 'history-item';
            el.style.borderColor = color;
            el.innerHTML = `
                <div class="history-item-top">
                    <span class="history-amount">${h.currency.symbol}${h.amount.toFixed(2)}</span>
                    <span class="badge ${badge}">${h.result}</span>
                </div>
                <div class="history-meta-text">
                    ${h.acc.label} &nbsp;|&nbsp; ⏰ ${h.timeStr} &nbsp;|&nbsp; 🎯 ${h.risk.toFixed(1)}% &nbsp;|&nbsp; 🕐 ${h.ts}
                </div>
                <div id="reasons-${index}" style="display:none; margin-top:0.6rem;">
                    <div class="reasons-title" style="color:var(${h.is_fraud ? '--danger' : '--success'})">
                        ${h.is_fraud ? '⚠️ Why suspicious:' : '✅ Why safe:'}
                    </div>
                    ${reasonsHTML}
                </div>`;

            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const reasonsDiv = document.getElementById(`reasons-${index}`);
                const isVisible  = reasonsDiv.style.display !== 'none';
                document.querySelectorAll('[id^="reasons-"]').forEach(r => r.style.display = 'none');
                reasonsDiv.style.display = isVisible ? 'none' : 'block';
                activePanel = 'history';
                setLayout();
            });

            list.appendChild(el);
        });

        document.getElementById('panel-history').classList.remove('hidden');
    }

    function clearHistory(e) {
        if (e) e.stopPropagation();
        txHistory = [];
        document.getElementById('history-list').innerHTML = '';
        const content = document.getElementById('result-content');
        content.style.display = 'none';
        content.innerHTML = '';
        document.getElementById('result-placeholder').style.display = 'flex';
        activePanel = 'form';
        setLayout();
    }

    document.getElementById('clear-btn').addEventListener('click', e => { e.stopPropagation(); clearHistory(e); });
    window.addEventListener('resize', setLayout);
    setLayout();
    updateCurrencyLabel();
    updateLimitBar();
</script>
</body>
</html>
